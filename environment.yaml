name: Pixal3D
channels:
  - nvidia
  - conda-forge
dependencies:
  # Core
  - python=3.10
  - ipython
  - pip
  - uv

  # CUDA 12.4 stack
  - cuda=12.4.0
  - cuda-toolkit=12.4
  - cuda-version=12.4
  - cuda-python>=12.4

  # Compiler toolchain
  - gxx_linux-64=11
  - gcc_linux-64=11
  - sysroot_linux-64
  - cmake
  - ninja

  # CUDA libraries
  - cupy>=13.0.0

  # Python build tools
  - setuptools
  - pkg-config
  - wheel

  # Pip (all Python packages from the Pixal3D repo requirements-hfdemo.txt)
  - pip:
      # PyTorch index
      - --extra-index-url https://download.pytorch.org/whl/cu124

      # Core ML & PyTorch ecosystem
      - torch==2.6.0
      - torchvision==0.21.0
      - triton==3.2.0
      - transformers==4.57.3
      - timm>=1.0.27
      - diffusers==0.37.1
      - accelerate==1.13.0
      - gradio
      - kornia==0.8.2

      # Image & Video
      - pillow==12.0.0
      - imageio==2.37.2
      - imageio-ffmpeg==0.6.0
      - opencv-python-headless==4.12.0.88

      # 3D & Geometry
      - trimesh==4.10.1
      - plyfile==1.1.3

      # Utilities
      - numpy
      - rich
      - hydra-core
      - easydict==1.13
      - tqdm==4.67.1
      - zstandard==0.25.0
      - pytest>=7.0.0

      # Git repository
      - git+https://github.com/microsoft/MoGe.git

      # Custom wheels (CPU/GPU binaries)
      - https://github.com/JeffreyXiang/Storages/releases/download/Space_Wheels_251210/flash_attn_3-3.0.0b1-cp39-abi3-linux_x86_64.whl
      - https://github.com/JeffreyXiang/Storages/releases/download/Space_Wheels_251210/cumesh-0.0.1-cp310-cp310-linux_x86_64.whl
      - https://github.com/JeffreyXiang/Storages/releases/download/Space_Wheels_251210/flex_gemm-0.0.1-cp310-cp310-linux_x86_64.whl
      - https://github.com/JeffreyXiang/Storages/releases/download/Space_Wheels_251210/o_voxel-0.0.1-cp310-cp310-linux_x86_64.whl
      - https://github.com/JeffreyXiang/Storages/releases/download/Space_Wheels_251210/nvdiffrast-0.4.0-cp310-cp310-linux_x86_64.whl
      - https://github.com/JeffreyXiang/Storages/releases/download/Space_Wheels_251210/nvdiffrec_render-0.0.0-cp310-cp310-linux_x86_64.whl

      # GLB to Image rendering (for preview_model tools)
      - 3d-to-image
